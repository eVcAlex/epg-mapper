name: Generate curated playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      M3U_SOURCE_URL: ${{ secrets.M3U_SOURCE_URL }}
      EPG_SOURCE_URL: https://raw.githubusercontent.com/ferteque/Curated-M3U-Repository_2/main/epg6.xml.gz
      OUTPUT_M3U: output/megaott.m3u
      OUTPUT_REPORT: output/report.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npm run map

      - name: Validate output
        run: |
          test -s output/megaott.m3u
          test -s output/report.json
          cat output/report.json

      # Optional publishing to Cloudflare R2.
      # Add repository secrets: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID,
      # R2_SECRET_ACCESS_KEY and R2_BUCKET.
      - name: Publish to Cloudflare R2
        if: ${{ env.R2_BUCKET != '' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          aws s3 cp output/megaott.m3u "s3://$R2_BUCKET/megaott.m3u" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --content-type "audio/x-mpegurl" \
            --cache-control "no-cache, max-age=60"
